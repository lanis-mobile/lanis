name: CI

on:
  pull_request:
  push:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Generate l10n
        run: dart run intl_utils:generate

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: App unit and widget tests
        run: flutter test
