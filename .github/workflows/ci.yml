name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Generate l10n
        run: dart run intl_utils:generate

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: App unit and widget tests
        run: flutter test

      - name: Install liblanis dependencies
        working-directory: liblanis
        run: dart pub get

      - name: liblanis unit tests
        working-directory: liblanis
        run: dart test
